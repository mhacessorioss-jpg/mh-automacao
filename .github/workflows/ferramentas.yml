name: 3 · Ferramentas (uso do Claude)

on:
  workflow_dispatch:
    inputs:
      tarefa:
        description: "Tarefa"
        required: true
        default: limpar_modelo
      argumento:
        description: "Argumento (ex.: caminho da imagem do Story)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: mh-fila
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Executar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_HOST: ${{ vars.GRAPH_HOST }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          TAREFA: ${{ inputs.tarefa }}
          ARGUMENTO: ${{ inputs.argumento }}
        run: python -m "mh.$TAREFA" $ARGUMENTO
      - name: Salvar
        run: |
          git config user.name "MH Robô"; git config user.email "robo@users.noreply.github.com"
          git add marca campanhas revisao && git commit -m "Ferramenta: ${{ inputs.tarefa }}" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
