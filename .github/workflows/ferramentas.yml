name: 3 · Ferramentas (uso do Claude)

on:
  workflow_dispatch:
    inputs:
      tarefa:
        description: "Tarefa"
        required: true
        default: limpar_modelo

permissions:
  contents: write

concurrency:
  group: mh-fila
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Executar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
        run: python -m mh.${{ inputs.tarefa }}
      - name: Salvar
        run: |
          git config user.name "MH Robô"; git config user.email "robo@users.noreply.github.com"
          git add marca && git commit -m "Ferramenta: ${{ inputs.tarefa }}" && git push || true
