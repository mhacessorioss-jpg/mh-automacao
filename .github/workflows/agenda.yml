name: 4 · Stories agendados

on:
  schedule:
    - cron: "*/10 * * * *"   # confere a agenda a cada 10 minutos
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mh-fila
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Publicar Stories do horário
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_HOST: ${{ vars.GRAPH_HOST }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
        run: |
          for c in campanhas/*/agenda.json; do [ -f "$c" ] && python -m mh.agenda_stories "$(dirname $c)"; done
      - name: Salvar
        run: |
          git config user.name "MH Robô"; git config user.email "robo@users.noreply.github.com"
          git add campanhas && git commit -m "Stories agendados: atualização" && git push || true
