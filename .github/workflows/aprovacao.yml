name: 2 · Aprovar, refazer ou pular

on:
  issues:
    types: [labeled, closed]

permissions:
  contents: write
  issues: write

concurrency:
  group: mh-fila
  cancel-in-progress: false

jobs:
  publicar:
    if: github.event.action == 'labeled' && github.event.label.name == 'aprovado'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Publicar no Instagram
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_HOST: ${{ vars.GRAPH_HOST }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
        run: python -m mh.publicar ${{ github.event.issue.number }}
      - name: Salvar estado
        if: always()
        run: |
          git config user.name "MH Robô"; git config user.email "robo@users.noreply.github.com"
          git pull --rebase || true
          git add estado && git commit -m "Publicado (issue #${{ github.event.issue.number }})" && git push || true

  refazer:
    if: github.event.action == 'labeled' && github.event.label.name == 'refazer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Gerar nova imagem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
        run: |
          COD=$(python -m mh.aprovacao codigo ${{ github.event.issue.number }})
          python -m mh.gerar --codigo "$COD"
          git config user.name "MH Robô"; git config user.email "robo@users.noreply.github.com"
          git add fila estado && git commit -m "Refeito: $COD" && git push || true
          python -m mh.aprovacao refeito ${{ github.event.issue.number }}

  pular:
    if: github.event.action == 'closed' && !contains(github.event.issue.labels.*.name, 'aprovado')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Tirar a peça da fila
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m mh.aprovacao descartar ${{ github.event.issue.number }}
          git config user.name "MH Robô"; git config user.email "robo@users.noreply.github.com"
          git add estado && git commit -m "Peça pulada (issue #${{ github.event.issue.number }})" && git push || true
